[workspace]
resolver = "3"
members = ["crates/parlar", "crates/parlar-moonshine", "crates/parlard"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.5"
repository = "https://github.com/agent-sh/parlar"
homepage = "https://github.com/agent-sh/parlar"
rust-version = "1.91"

[profile.release]
lto = "thin"
codegen-units = 4
