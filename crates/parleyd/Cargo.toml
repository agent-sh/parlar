[package]
name = "parleyd"
description = "parley daemon: audio in and out, speech models, conversation state"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = { version = "0.18", features = ["pipewire"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic"] }
parley = { path = "../parley" }
parley-moonshine = { path = "../parley-moonshine" }
realfft = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonora = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process"] }

[dev-dependencies]
tempfile = "3"
