name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUSTFLAGS: -D warnings
  APT_DEPS: libpipewire-0.3-dev libasound2-dev pkg-config clang

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: cargo test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - run: cargo test --locked --no-fail-fast

  msrv:
    name: rust-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - run: cargo check --locked --all-targets

  rustdoc-and-package:
    name: rustdoc and cargo package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --document-private-items
      - run: cargo publish --workspace --dry-run --locked

  supply-chain:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings

  agent-config:
    name: agnix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g agnix
      - run: agnix .

  plugins:
    name: plugins, scripts and versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: sh -n scripts/install.sh && sh -n plugin/claude/bin/parlar && sh -n plugin/codex/bin/parlar
      - name: Manifests parse
        run: |
          for f in .claude-plugin/marketplace.json plugin/claude/.claude-plugin/plugin.json plugin/claude/.mcp.json \
                   plugin/claude/hooks/hooks.json plugin/codex/.codex-plugin/plugin.json plugin/codex/.mcp.json \
                   plugin/codex/hooks/hooks.json shell/gnome/parlar@avifenesh/metadata.json; do
            python3 -m json.tool "$f" > /dev/null
          done
      - name: Plugin versions match Cargo.toml
        run: |
          want="$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          for f in plugin/claude/.claude-plugin/plugin.json plugin/codex/.codex-plugin/plugin.json; do
            got="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['version'])" "$f")"
            test "$got" = "$want" || { echo "$f is $got, Cargo.toml is $want" >&2; exit 1; }
          done

  release-binary:
    name: release artifact (${{ matrix.target }})
    needs: [fmt, clippy, test, msrv, rustdoc-and-package, supply-chain, agent-config, plugins]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - run: cargo build --locked --release
      - name: Stage artifact
        run: |
          name="parlar-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/release/parlar target/release/parlard README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          generate_release_notes: true

  publish-crates:
    name: publish crates
    needs: [release-binary]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - name: Publish to crates.io
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          version="$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          test "v$version" = "$GITHUB_REF_NAME"
          # dependency order: parlard depends on the other two
          for crate in parlar parlar-moonshine parlard; do
            if curl -fsS -A "agent-sh/parlar ci" "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null; then
              echo "${crate} ${version} is already on crates.io; skipping"
            else
              cargo publish --locked -p "$crate"
            fi
          done
