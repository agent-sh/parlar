name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PipeWire headers
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev pkg-config clang
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      - name: Clippy
        run: cargo clippy --release --locked -- -D warnings
      - name: Shell scripts
        run: sh -n scripts/install.sh && sh -n plugin/claude/bin/parley
      - name: Plugin manifests
        run: |
          for f in .claude-plugin/marketplace.json plugin/claude/.claude-plugin/plugin.json plugin/claude/.mcp.json \
                   plugin/claude/hooks/hooks.json plugin/codex/.codex-plugin/plugin.json plugin/codex/.mcp.json \
                   plugin/codex/hooks/hooks.json shell/gnome/parley@avifenesh/metadata.json; do
            python3 -m json.tool "$f" > /dev/null
          done
