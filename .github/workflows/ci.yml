name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUSTFLAGS: -D warnings
  APT_DEPS: libpipewire-0.3-dev libasound2-dev pkg-config clang

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: cargo test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - run: cargo test --locked --no-fail-fast

  windows:
    name: windows (build, test, named pipe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo build --locked --release
      - run: cargo test --locked --release
      # the build, for trying it on a Windows desktop, with the VC++ runtime a fresh Windows lacks
      - name: Gather the Visual C++ runtime next to the binaries
        shell: pwsh
        run: foreach ($dll in 'vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll') { Copy-Item "C:\Windows\System32\$dll" target\release\ }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parlar-windows-x86_64
          path: |
            target/release/parlar.exe
            target/release/parlard.exe
            target/release/onnxruntime.dll
            target/release/vcruntime140.dll
            target/release/vcruntime140_1.dll
            target/release/msvcp140.dll
          retention-days: 7
      - name: parlard answers on its named pipe
        shell: pwsh
        # a hung pipe must fail fast, not stall the job
        timeout-minutes: 3
        run: |
          $d = Start-Process -FilePath target\release\parlard.exe -ArgumentList '--no-mic','--silent' -PassThru -RedirectStandardError parlard.log
          Start-Sleep -Seconds 3
          target\release\parlar.exe ctl state
          if ($LASTEXITCODE -ne 0) { Get-Content parlard.log; exit 1 }
          target\release\parlar.exe ctl on
          '{"session_id":"ci"}' | target\release\parlar.exe hook prompt --harness claude
          target\release\parlar.exe ctl state
          Stop-Process -Id $d.Id
          Get-Content parlard.log
      - name: plugin launcher (.cmd) runs parlar, passes its exit code, stays quiet without it
        shell: cmd
        run: |
          set "PARLAR_BIN=%CD%\target\release\parlar.exe"
          call plugin\claude\bin\parlar.cmd --version || exit /b 1
          rem parlard is not running now, so ctl state must fail through the launcher
          call plugin\claude\bin\parlar.cmd ctl state
          if not errorlevel 1 exit /b 1
          set "PARLAR_BIN="
          set "PATH=C:\Windows\System32"
          echo {} | call plugin\claude\bin\parlar.cmd hook prompt || exit /b 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npm package installs on Windows and runs without sh
        shell: pwsh
        run: |
          $prefix = "$env:RUNNER_TEMP\npm-prefix"
          $package = npm pack --pack-destination $env:RUNNER_TEMP --silent
          $env:PARLAR_NPM_LOCAL_DIR = "$PWD\target\release"
          npm install -g --prefix $prefix --foreground-scripts "$env:RUNNER_TEMP\$package"
          # no Git, no sh: only the npm prefix, node and Windows itself
          $env:PATH = "$prefix;$(Split-Path (Get-Command node).Source);C:\Windows\System32"
          & "$prefix\parlar.cmd" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$prefix\parlard.cmd" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # the plugin launcher finds the native binary inside the npm package
          cmd /c "plugin\claude\bin\parlar.cmd --version"
          if ($LASTEXITCODE -ne 0) { exit 1 }

  msrv:
    name: rust-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - run: cargo check --locked --all-targets

  rustdoc-and-package:
    name: rustdoc and cargo package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --document-private-items
      - run: cargo publish --workspace --dry-run --locked

  supply-chain:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings

  agent-config:
    name: agnix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g agnix
      - run: agnix .

  plugins:
    name: plugins, scripts and versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: sh -n scripts/install.sh && sh -n plugin/claude/bin/parlar && sh -n plugin/codex/bin/parlar
      - name: Manifests parse
        run: |
          for f in .claude-plugin/marketplace.json plugin/claude/.claude-plugin/plugin.json plugin/claude/.mcp.json \
                   plugin/claude/hooks/hooks.json plugin/codex/.codex-plugin/plugin.json plugin/codex/.mcp.json \
                   plugin/codex/hooks/hooks.json shell/gnome/parlar@avifenesh/metadata.json; do
            python3 -m json.tool "$f" > /dev/null
          done
      - name: Plugin and npm versions match Cargo.toml
        run: |
          want="$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          for f in plugin/claude/.claude-plugin/plugin.json plugin/codex/.codex-plugin/plugin.json package.json; do
            got="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['version'])" "$f")"
            test "$got" = "$want" || { echo "$f is $got, Cargo.toml is $want" >&2; exit 1; }
          done

  npm-wrapper:
    name: npm wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - run: node --check npm/install.js && node --check npm/bin/launch.js && node --check npm/bin/parlar.js && node --check npm/bin/parlard.js
      - run: cargo build --locked
      - name: Install the packed package against the local build
        run: |
          prefix="$RUNNER_TEMP/npm-prefix"
          package="$(npm pack --pack-destination "$RUNNER_TEMP" --silent)"
          PARLAR_NPM_LOCAL_DIR="$PWD/target/debug" npm install -g --prefix "$prefix" --foreground-scripts "$RUNNER_TEMP/$package"
          "$prefix/bin/parlar" --version
          "$prefix/bin/parlard" --version
          echo '{}' | "$prefix/bin/parlar" hook stop --harness claude

  release-binary:
    name: release artifact (${{ matrix.target }})
    needs: [fmt, clippy, test, msrv, rustdoc-and-package, supply-chain, agent-config, plugins, npm-wrapper]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - run: cargo build --locked --release
      - name: Stage artifact
        shell: bash
        run: |
          name="parlar-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = Windows ]; then
            # libmoonshine is linked in; ONNX Runtime and the Visual C++ runtime (app-local, as
            # Microsoft allows) ship next to the binaries, so a fresh Windows needs nothing else
            cp target/release/parlar.exe target/release/parlard.exe target/release/onnxruntime.dll "dist/$name/"
            for dll in vcruntime140.dll vcruntime140_1.dll msvcp140.dll; do cp "/c/Windows/System32/$dll" "dist/$name/"; done
          else
            cp target/release/parlar target/release/parlard "dist/$name/"
          fi
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          generate_release_notes: true

  publish-crates:
    name: publish crates
    needs: [release-binary]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - name: Publish to crates.io
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          version="$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          test "v$version" = "$GITHUB_REF_NAME"
          # dependency order: parlard depends on the other two
          for crate in parlar parlar-moonshine parlard; do
            if curl -fsS -A "agent-sh/parlar ci" "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null; then
              echo "${crate} ${version} is already on crates.io; skipping"
            else
              cargo publish --locked -p "$crate"
            fi
          done

  publish-npm:
    name: publish npm
    needs: [release-binary]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish to npm
        run: |
          test -n "$NODE_AUTH_TOKEN"
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$GITHUB_REF_NAME"
          # the install script downloads these, so they must be live first
          base="https://github.com/agent-sh/parlar/releases/download/v${version}"
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            for suffix in "" ".sha256"; do
              asset="parlar-v${version}-${target}.tar.gz${suffix}"
              for attempt in $(seq 1 30); do
                curl -fsSIL "${base}/${asset}" >/dev/null && break
                [ "$attempt" = 30 ] && { echo "release asset not available: ${asset}" >&2; exit 1; }
                sleep 5
              done
            done
          done
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name} ${version} is already on npm; skipping"
          else
            npm publish --access public
          fi

